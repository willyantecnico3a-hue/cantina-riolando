<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#008f5a" />
  <title>App Cantina Riolando</title>
  <link rel="manifest" href="manifest-app.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="totem_ui.css" />
  <link rel="stylesheet" href="app_mobile.css" />
</head>
<body class="modo-app">
  <header class="topo topo-app">
    <div class="app-identidade">
      <p class="app-local">⌖ Cantina Riolando</p>
      <h1>Olá! O que você quer pedir?</h1>
    </div>
    <a class="app-link-pedidos" href="minha-conta.html" aria-label="Meus pedidos">◷<span>Pedidos</span></a>
  </header>

  <main class="app-shell">
    <section class="app-instalar">
      <div>
        <strong>Instale no celular</strong>
        <p>Acesse a cantina mais rapido pela tela inicial.</p>
      </div>
      <button id="installPwaButton" class="btn" type="button" hidden>Instalar</button>
    </section>

    <section class="app-destaque">
      <div>
        <span>PEÇA SEM FILA</span>
        <strong>Seu lanche favorito,<br>pronto para retirar.</strong>
        <p>Faça o pedido e pague pelo Pix.</p>
      </div>
      <div class="app-destaque-icone" aria-hidden="true">🍔</div>
    </section>

    <section class="app-card-produtos">
      <div id="produtos" class="grid-produtos"></div>
    </section>

    <aside class="card carrinho app-carrinho">
      <h2>Meu pedido</h2>

      <label>Nome do aluno</label>
      <input id="clienteNome" autocomplete="name" placeholder="Ex: Joao Silva" />

      <label>E-mail institucional</label>
      <input id="clienteEmail" type="email" autocomplete="email" placeholder="exemplo@aluno.educacao.sp.gov.br" />

      <div id="itensCarrinho"></div>

      <h3>Total: <span id="total">R$ 0,00</span></h3>

      <button class="btn principal" onclick="finalizarPedido()">Gerar Pix</button>
      <button class="btn limpar" onclick="limparCarrinho()">Limpar</button>

      <div id="resultadoPedido" class="resultado"></div>
    </aside>
  </main>

  <button id="resumoCarrinhoApp" class="resumo-carrinho-app" type="button" onclick="abrirCarrinhoApp()">
    <span id="resumoCarrinhoQtd">0 itens</span>
    <strong id="resumoCarrinhoTotal">R$ 0,00</strong>
    <span>Ver pedido</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="app.js"></script>
</body>
</html>
